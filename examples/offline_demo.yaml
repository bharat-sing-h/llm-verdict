# Fully offline demo: red-team a toy app with no API keys.
#   evalharness run examples/offline_demo.yaml --label naive
#   APP=guarded_bot evalharness run examples/offline_demo.yaml --label guarded
#   evalharness compare naive__prompt_injection guarded__prompt_injection
model:
  provider: function
  target: examples.apps.support_bot:${APP:-naive_bot}

tasks:
  - builtin: prompt_injection
    options: { n_variants: 4, seed: 0 }

execution:
  concurrency: 4
  cache: false
