[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "llmverdict"
version = "0.1.0"
description = "Production-grade LLM evaluation & red-teaming framework with statistically rigorous model comparison."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bharat-sing-h" }]
keywords = ["llm", "evaluation", "benchmark", "red-teaming", "mlops", "prompt-injection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.1"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
llmverdict = "llmverdict.cli:app"

[project.urls]
Repository = "https://github.com/bharat-sing-h/llm-verdict"

[tool.hatch.build.targets.wheel]
packages = ["src/llmverdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["llmverdict"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
  "B008",    # typer uses function calls in defaults
  "RUF001",  # intentional typographic unicode (κ, Δ, ×, –) in reports and docs
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["llmverdict"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
